name: Main

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Validate JavaScript syntax
        run: node --check *.js

      - name: Build project
        run: npm run build
