name: Main

on:
  push:
    branches: ["Main"]
  pull_request:
    branches: ["Main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          shopt -s nullglob
          files=( *.js )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No root-level JavaScript files found to validate."
            exit 0
          fi

          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Build static site
        run: npm run build
