name: Main

on:
  push:
    branches: ["Main"]
  pull_request:
    branches: ["Main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done

      - name: Build static site
        run: npm run build
