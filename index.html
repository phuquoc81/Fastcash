<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bisswiz - Card Game</title>

    <!-- Social media / Open Graph meta tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Bisswiz – Card Game">
    <meta property="og:description" content="Play Bisswiz, the fast-paced trick-taking card game for 2–4 players. First team to 500 points wins!">
    <meta property="og:url" content="https://phuquoc81.github.io/Bisswiz/">
    <meta property="og:image" content="https://phuquoc81.github.io/Bisswiz/preview.png">

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bisswiz – Card Game">
    <meta name="twitter:description" content="Play Bisswiz, the fast-paced trick-taking card game for 2–4 players. First team to 500 points wins!">
    <meta name="twitter:image" content="https://phuquoc81.github.io/Bisswiz/preview.png">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Setup Screen -->
    <div id="setupScreen" class="screen">
        <div class="setup-container">
            <h1>🃏 Bisswiz</h1>
            <p class="tagline">Card Game · 2–4 Players · First Team to 500 Points Wins!</p>

            <div class="setup-section">
                <label>Number of Players:</label>
                <div class="player-count-btns">
                    <button class="count-btn active" data-count="2">2 Players</button>
                    <button class="count-btn" data-count="3">3 Players</button>
                    <button class="count-btn" data-count="4">4 Players</button>
                </div>
            </div>

            <div id="playerSetup" class="setup-section"></div>

            <div class="setup-section">
                <label>Starting Credits:</label>
                <input type="number" id="startingCredits" value="500" min="100" max="9999" class="credits-input">
            </div>

            <button id="startGameBtn" class="btn-primary">🎮 Start Game</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen hidden">
        <div class="game-layout">

            <!-- Scoreboard sidebar -->
            <aside class="scoreboard">
                <h2>🏆 Scores</h2>
                <div id="scoreDisplay"></div>
                <div class="target-info">First to <strong>500 pts</strong> wins!</div>
                <div class="round-badge">Round <span id="roundBadge">1</span></div>
            </aside>

            <!-- Main table -->
            <div class="game-table">
                <div id="opponentsArea" class="opponents-area"></div>

                <div class="center-area">
                    <div id="trickArea" class="trick-area"></div>
                    <div id="roundInfo" class="round-info"></div>
                </div>

                <div class="player-area">
                    <div class="player-info">
                        <span id="playerNameDisplay" class="player-name"></span>
                        <span id="playerCreditsDisplay" class="player-credits"></span>
                    </div>
                    <div id="playerHand" class="card-hand"></div>
                </div>
            </div>

        </div>

        <!-- Betting Panel (modal) -->
        <div id="bettingPanel" class="modal-overlay hidden">
            <div class="modal-box">
                <h3>💰 Place Your Bet</h3>
                <p id="betRoundLabel">Bet for Round 1:</p>
                <input type="number" id="betAmount" value="10" min="0" class="bet-input">
                <button id="placeBetBtn" class="btn-primary">Confirm Bet</button>
            </div>
        </div>

        <!-- Game message toast -->
        <div id="gameMessage" class="game-message"></div>
    </div>

    <!-- Win Screen -->
    <div id="winScreen" class="screen hidden">
        <div class="win-container">
            <div id="winMessage"></div>
            <div id="finalScores"></div>
            <div class="share-section">
                <p class="share-label">Share your victory!</p>
                <div class="share-buttons">
                    <button id="shareTwitterBtn" class="btn-share btn-twitter">𝕏 Share on X</button>
                    <button id="shareFacebookBtn" class="btn-share btn-facebook">📘 Share on Facebook</button>
                    <button id="shareCopyBtn" class="btn-share btn-copy">🔗 Copy Link</button>
                </div>
            </div>
            <button id="playAgainBtn" class="btn-primary">🔄 Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
